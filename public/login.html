<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>jinhyuk.xyz — 로그인</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="appbar">
  <a class="brand" href="/">
    <span class="project-mark" aria-hidden="true"><span></span><span></span><span></span></span>
    <strong>jinhyuk.xyz</strong>
  </a>
  <div class="appbar-tools">
    <a class="btn sm" href="/">처음으로</a>
  </div>
</header>
<main class="login-wrap">
  <form class="login-card rise" id="loginForm" autocomplete="off">
    <label class="api-field">
      <span class="api-title">API</span>
      <input id="apiKeyInput" type="password" placeholder="" spellcheck="false" autocomplete="off" required />
    </label>
    <button class="btn primary block big-btn" id="submitBtn" type="submit">입장</button>
    <p class="msg" id="msg" role="status"></p>
  </form>
</main>
<script>
(() => {
  const TOKEN_KEY = 'jinhyuk-api-key';
  const TOKEN_RE = /^tmk_[A-Za-z0-9_-]{20,}$/;
  const form = document.getElementById('loginForm');
  const input = document.getElementById('apiKeyInput');
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');
  const say = (text, ok) => { msg.textContent = text; msg.className = 'msg' + (ok ? ' ok' : ''); };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const key = input.value.trim();
    if (!TOKEN_RE.test(key)) { say('키 형식이 올바르지 않습니다. tmk_ 로 시작하는 키를 입력하세요.'); input.focus(); return; }
    btn.disabled = true; say('확인 중...');
    try {
      const res = await fetch('/api/auth/me', { headers: { authorization: 'Bearer ' + key } });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.user) throw new Error(res.status === 401 ? 'API 키가 맞지 않거나 차단되었습니다.' : (data.error || '확인에 실패했습니다.'));
      localStorage.setItem(TOKEN_KEY, key);
      say('로그인 성공. 이동합니다...', true);
      if (window.opener && !window.opener.closed) {
        try { window.opener.location.href = '/admin#projects'; } catch {}
        window.close();
      }
      setTimeout(() => { location.href = '/admin#projects'; }, 300);
    } catch (err) {
      say(err.message || '네트워크 오류입니다.');
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
