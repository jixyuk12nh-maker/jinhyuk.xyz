<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>jinhyuk.xyz — 로그인</title>
<link rel="stylesheet" href="/style.css">
<style>
  body{background:radial-gradient(circle at 20% 10%,rgba(120,130,150,.35),transparent 45%),radial-gradient(circle at 85% 90%,rgba(90,110,140,.3),transparent 50%),linear-gradient(160deg,#1d2029 0%,#3d4350 48%,#15171d 100%) fixed}
  .login-wrap{min-height:calc(100vh - 96px);min-height:calc(100dvh - 96px)}

  
  .login-card{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.05) 55%,rgba(255,255,255,.12));border:1px solid rgba(255,255,255,.34);box-shadow:0 30px 70px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.08);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%)}
  .login-card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.22) 48%,transparent 62%);transform:translateX(-120%);animation:sheen 3.8s ease-in-out 1s infinite}
  @keyframes sheen{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
  .api-field input{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.3);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .api-field input:focus{background:rgba(255,255,255,.12)}
  .big-btn{background:rgba(255,255,255,.88);box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 1px 0 #fff}
  @media (prefers-reduced-motion: reduce){.login-card::after{animation:none}}
  body::before,body::after{content:"";position:fixed;z-index:0;border-radius:50%;filter:blur(60px);pointer-events:none}
  body::before{width:360px;height:360px;top:12%;left:14%;background:#8fb4ff;opacity:.45}
  body::after{width:320px;height:320px;bottom:8%;right:12%;background:#c59cff;opacity:.4}
  .login-wrap{position:relative;z-index:1}
</style>
</head>
<body>
<header class="appbar">
  <a class="brand" href="/">
    <span class="project-mark" aria-hidden="true"><span></span><span></span><span></span></span>
    <strong>jinhyuk.xyz</strong>
  </a>
  <div class="appbar-tools">
    <a class="btn sm" href="/">처음으로</a>
  </div>
</header>
<main class="login-wrap">
  <form class="login-card rise" id="loginForm" autocomplete="off">
    <label class="api-field">
      <span class="api-title">API</span>
      <input id="apiKeyInput" type="password" placeholder="" spellcheck="false" autocomplete="off" required />
    </label>
    <button class="btn primary block big-btn" id="submitBtn" type="submit">입장</button>
    <p class="msg" id="msg" role="status"></p>
  </form>
</main>
<script>
(() => {
  const TOKEN_KEY = 'jinhyuk-api-key';
  const TOKEN_RE = /^tmk_[A-Za-z0-9_-]{20,}$/;
  const form = document.getElementById('loginForm');
  const input = document.getElementById('apiKeyInput');
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');
  const say = (text, ok) => { msg.textContent = text; msg.className = 'msg' + (ok ? ' ok' : ''); };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const key = input.value.trim();
    if (!TOKEN_RE.test(key)) { say('키 형식이 올바르지 않습니다. tmk_ 로 시작하는 키를 입력하세요.'); input.focus(); return; }
    btn.disabled = true; say('확인 중...');
    try {
      const res = await fetch('/api/auth/me', { headers: { authorization: 'Bearer ' + key } });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.user) throw new Error(res.status === 401 ? 'API 키가 맞지 않거나 차단되었습니다.' : (data.error || '확인에 실패했습니다.'));
      localStorage.setItem(TOKEN_KEY, key);
      say('로그인 성공. 이동합니다...', true);
      if (window.opener && !window.opener.closed) {
        try { window.opener.location.href = '/admin#projects'; } catch {}
        window.close();
      }
      setTimeout(() => { location.href = '/admin#projects'; }, 300);
    } catch (err) {
      say(err.message || '네트워크 오류입니다.');
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
