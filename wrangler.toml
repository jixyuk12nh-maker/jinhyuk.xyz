name = "tm"
main = "src/worker.js"
compatibility_date = "2026-10-16"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/raw/*"]

[[d1_databases]]
binding = "DB"
database_name = "tm-db"
database_id = "9951ea1d-ab4d-44a8-8ba5-9e962092cf82"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "SCRIPTS"
bucket_name = "jinhyuk--xyz"
