name = "tm"
main = "cloudflare/worker.js"
compatibility_date = "2026-10-16"

[[d1_databases]]
binding = "DB"
database_name = "tm-db"
database_id = "9951ea1d-ab4d-44a8-8ba5-9e962092cf82"
migrations_dir = "cloudflare/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "jinhyuk--xyz"

[assets]
directory = "./public"
binding = "ASSETS"
# Route API and health checks through the Worker before static asset handling.
run_worker_first = ["/health", "/api/*", "/v1/*"]
not_found_handling = "single-page-application"
